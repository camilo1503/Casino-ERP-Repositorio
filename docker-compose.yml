# PitBoss ERP en local con Docker Compose (taller §1.3)
#   docker compose up -d --build   → front en http://localhost:8080 · Swagger en /swagger
#   docker compose down            → detiene (los datos quedan en el volumen)
#   docker compose down -v         → detiene y borra los datos
# Development toma la clave JWT y el código TOTP de demo de appsettings.Development.json (no son secretos reales).
services:
  api:
    build: .
    image: pitboss-erp:1.0
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
    volumes:
      - pitboss-datos:/app/datos

volumes:
  pitboss-datos:
