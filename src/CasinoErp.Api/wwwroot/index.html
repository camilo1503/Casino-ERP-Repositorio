  sched:fd=>{const id=fd.get('id'),v={name:fd.get('name').trim(),freq:fd.get('freq'),to:fd.get('to').trim()};if(!v.name){S.modal.err='Ponle nombre al reporte.';S.modal.v=v;return;}if(!v.to||v.to.split(',').some(e=>!emailOk(e.trim()))){S.modal.err='Escribe al menos un correo válido.';S.modal.v=v;return;}
    if(id){Object.assign(S.sched.find(r=>r.id===id),{freq:v.freq,to:v.to});audit('Reportes','U','Reporte programado '+id,`Reporte modificado · ${v.freq}`);toast('Reporte actualizado. Aplica desde el próximo envío.');}else{const nid='r'+(S.rSeq++);S.sched.push({id:nid,...v,owner:cur().name});audit('Reportes','C','Reporte programado '+nid,`Reporte programado · ${v.name} · ${v.freq}`,'ok');toast('Reporte programado.');}S.modal=null;},
  userNew:fd=>{const v={name:fd.get('name').trim(),email:fd.get('email').trim().toLowerCase(),role:fd.get('role'),sid:fd.get('sid')};if(!v.name){S.modal.err='Escribe el nombre.';S.modal.v=v;return;}if(!emailOk(v.email)){S.modal.err='El correo no es válido.';S.modal.v=v;return;}if(S.users.some(u=>u.email===v.email)){S.modal.err='Ya existe una cuenta con ese correo.';S.modal.v=v;return;}if(v.role==='crupier'&&!v.sid){S.modal.err='Vincula el usuario de crupier a un empleado para asignarle su mesa.';S.modal.v=v;return;}if(v.sid&&v.role==='crupier'&&staff(v.sid).role!=='Crupier'){S.modal.err='El empleado vinculado no es crupier.';S.modal.v=v;return;}
    const id='u'+(S.uSeq++);S.users.push({id,name:v.name,email:v.email,role:v.role,st:'Activo',last:'Nunca',sid:v.sid||undefined});audit('Usuarios y roles','C','Usuario '+id,`Cuenta creada · ${v.name} · ${ROLES[v.role].l}`,'ok');S.modal=null;toast(`Cuenta creada. Contraseña temporal enviada a ${v.email}.`);},
  userRole:fd=>{const x=userById(fd.get('id')),r=fd.get('role');if(x.role==='admin'&&r!=='admin'&&S.users.filter(u=>u.role==='admin'&&u.st==='Activo').length===1){toast('No puedes quitar el rol al último administrador.',true);return;}x.role=r;audit('Usuarios y roles','U','Usuario '+x.id,`Rol cambiado a ${ROLES[r].l} · ${x.name}`);S.modal=null;toast(`${x.name} ahora es ${ROLES[r].l.toLowerCase()}.`);},
  pReg:()=>{const r=S.pa.reg;let err='';if(!r.name.trim())err='Escribe tu nombre.';else if(!r.birth)err='Indica tu fecha de nacimiento.';else if(age(r.birth)<18)err='Debes ser mayor de 18 años para registrarte.';else if(!emailOk(r.email))err='Escribe un correo válido.';else if(S.players.some(p=>p.email.toLowerCase()===r.email.trim().toLowerCase()))err='Este correo ya está registrado.';else if(pwRules(r.pass).some(x=>!x[0]))err='Tu contraseña no cumple las reglas.';else if(r.pass!==r.pass2)err='Las contraseñas no coinciden.';else if(!r.ok)err='Debes aceptar la política de datos para continuar.';
    if(err){S.pa.err=err;return;}const p=addPlayer({name:r.name.trim(),email:r.email.trim(),docT:'CC',doc:'Por completar',birth:r.birth});S.pa.pid=p.id;S.pa.err='';S.pa.screen='perfil';},
  pProf:()=>{const f=S.pa.prof,p=player(S.pa.pid);if(!f.prefs.length){S.pa.err='Elige al menos un juego preferido.';return;}if(!f.phone.trim()){S.pa.err='Escribe tu teléfono.';return;}Object.assign(p,{phone:f.phone.trim(),prefs:[...f.prefs],slot:f.slot,city:f.city});S.pa.err='';S.pa.screen='home';S.pa.tab='inicio';toast('Perfil guardado.');}
};
function addPlayer(v){const id='p'+(S.players.length+1)+'n'+(Date.now()%1000);const p={id,name:v.name,docT:v.docT||'CC',doc:v.doc,email:v.email,phone:'',city:'Bogotá',birth:v.birth,points:0,prefs:[],slot:'Noche',avg:50000,visits:1,since:'octubre 2026',last:'Hoy '+now(),hist:[],st:'Activo',benefits:[],red:[]};S.players.push(p);S.newPlayers++;audit('Perfiles','C','Jugador '+id,`Jugador registrado · ${v.name}`,'ok');return p;}

/* ===================== Eventos ===================== */
function setPath(path,val){const k=path.split('.');let o=S;for(let i=0;i<k.length-1;i++)o=o[k[i]];o[k[k.length-1]]=val;}
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const fn=ACT[el.dataset.act];if(!fn)return;if(el.tagName==='BUTTON'&&el.type!=='submit')e.preventDefault();const r=fn(el.dataset.arg,el,e);if(r!==false)render();});
document.addEventListener('input',e=>{const el=e.target;if(el.dataset.bind){setPath(el.dataset.bind,el.type==='checkbox'?el.checked:el.value);if(el.dataset.bind.startsWith('pa.'))S.pa.err='';if(el.dataset.bind.startsWith('login.'))S.login.err='';render();}});
document.addEventListener('change',e=>{const el=e.target;if(el.dataset.actChange){const r=CHG[el.dataset.actChange](el);if(r!==false)render();}});
document.addEventListener('submit',e=>{const f=e.target.closest('[data-form]');if(!f)return;e.preventDefault();FORM[f.dataset.form](new FormData(f),f);render();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.modal){S.modal=null;render();}});
render();

</script>
