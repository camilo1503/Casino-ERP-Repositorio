<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>PitBoss ERP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: casino back-office shell — felt-green rail on the left, warm paper workspace, gold for money actions */
:root{
  --bg:#F5F3EC; --surface:#FFFFFF; --surface2:#EFECE3; --border:#E3DFD3; --fg:#1A1A1A; --muted:#6B6B6B; --faint:#9A9A9A;
  --felt:#0B3D2E; --felt2:#14523F; --felt-fg:#FFFFFF; --felt-muted:#8FB3A5; --felt-text:#CFE0D8;
  --brand:#0B3D2E; --brand-fg:#FFFFFF;
  --gold:#D4AF37; --gold-ink:#8A6A00; --gold-soft:#F8EFCF; --on-gold:#1A1A1A;
  --ok:#2E7D32; --ok-soft:#E6F2E7; --warn:#B26A00; --warn-soft:#FFF1D6; --bad:#B3261E; --bad-soft:#FBE4E2; --neu:#4A4A4A; --neu-soft:#ECEAE3;
  --shadow:0 18px 50px rgba(11,61,46,.18);
  --f-ui:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1513; --surface:#16201C; --surface2:#1D2924; --border:#2B3833; --fg:#ECEAE3; --muted:#A3AFA9; --faint:#76837D;
  --felt:#0A2E23; --felt2:#134535; --felt-fg:#FFFFFF; --felt-muted:#7FA595; --felt-text:#C6D9D0;
  --brand:#2F7A5F; --brand-fg:#FFFFFF;
  --gold:#D9B648; --gold-ink:#E6C766; --gold-soft:#3A3218; --on-gold:#1A1A1A;
  --ok:#74C27A; --ok-soft:#1C3220; --warn:#F0B04A; --warn-soft:#3A2C12; --bad:#F0837A; --bad-soft:#3E1D1A; --neu:#C9CFCB; --neu-soft:#2A322E;
  --shadow:0 18px 50px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1513; --surface:#16201C; --surface2:#1D2924; --border:#2B3833; --fg:#ECEAE3; --muted:#A3AFA9; --faint:#76837D;
  --felt:#0A2E23; --felt2:#134535; --felt-fg:#FFFFFF; --felt-muted:#7FA595; --felt-text:#C6D9D0;
  --brand:#2F7A5F; --brand-fg:#FFFFFF;
  --gold:#D9B648; --gold-ink:#E6C766; --gold-soft:#3A3218; --on-gold:#1A1A1A;
  --ok:#74C27A; --ok-soft:#1C3220; --warn:#F0B04A; --warn-soft:#3A2C12; --bad:#F0837A; --bad-soft:#3E1D1A; --neu:#C9CFCB; --neu-soft:#2A322E;
  --shadow:0 18px 50px rgba(0,0,0,.5); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;text-wrap:balance}
.num,td.r,.kpi b{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* shell */
.shell{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100%}
.side{background:var(--felt);color:var(--felt-fg);padding:20px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:12px;padding:0 8px 18px}
.brand b{font-size:20px;font-weight:800;letter-spacing:-.01em}
.brand small{display:block;font-size:10px;font-weight:700;letter-spacing:.15em;color:var(--gold)}
.navsec{font-size:10px;font-weight:700;letter-spacing:.12em;color:var(--felt-muted);padding:14px 10px 6px}
.nav{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:8px;color:var(--felt-text);font-weight:500;cursor:pointer;position:relative}
.nav:hover{background:var(--felt2)}
.nav:focus-visible{outline:2px solid var(--gold)}
.nav .dot{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--felt-muted);flex:none}
.nav.on{background:var(--felt2);color:#fff;font-weight:600}
.nav.on::before{content:"";position:absolute;left:0;top:7px;bottom:7px;width:3px;border-radius:2px;background:var(--gold)}
.nav.on .dot{background:var(--gold);border-color:var(--gold)}
.nav.locked{opacity:.45}
.nav .lock{margin-left:auto;font-size:11px}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding-top:16px}
.status{background:var(--felt2);border-radius:10px;padding:10px 12px;display:flex;gap:10px;align-items:center;font-size:13px;font-weight:600}
.status i{width:10px;height:10px;border-radius:50%;background:#4CD07D;flex:none}
.status small{display:block;font-weight:400;color:var(--felt-muted);font-size:11px}
.side-btn{all:unset;box-sizing:border-box;cursor:pointer;border:1px solid var(--felt-muted);color:var(--felt-text);border-radius:10px;padding:9px 12px;font-size:13px;font-weight:600;text-align:center}
.side-btn:hover{background:var(--felt2)}

.main{min-width:0;display:flex;flex-direction:column}
.hdr{background:var(--surface);border-bottom:1px solid var(--border);padding:16px 32px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.hdr-t{flex:1;min-width:220px}
.hdr-t h1{font-size:22px;font-weight:700;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.hdr-t p{margin:2px 0 0;color:var(--muted);font-size:13px}
.who{display:flex;align-items:center;gap:10px}
.av{width:36px;height:36px;border-radius:50%;background:var(--brand);color:var(--gold);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.who b{display:block;font-size:13px}.who small{color:var(--muted);font-size:12px}
.content{padding:24px 32px 40px;display:flex;flex-direction:column;gap:20px}

/* components */
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px 22px;min-width:0}
.card-h{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px}
.card-h h2{font-size:16px;font-weight:700}
.card-h p{margin:2px 0 0;color:var(--muted);font-size:12px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px 22px;position:relative}
.kpi::before{content:"";position:absolute;left:0;top:20px;bottom:20px;width:4px;border-radius:0 2px 2px 0;background:var(--gold)}
.kpi span{color:var(--muted);font-size:13px;font-weight:500}
.kpi b{display:block;font-size:28px;font-weight:800;margin:6px 0 4px;letter-spacing:-.01em}
.kpi small{font-size:12px;font-weight:600;color:var(--muted)}
.kpi small.ok{color:var(--ok)}.kpi small.warn{color:var(--warn)}.kpi small.bad{color:var(--bad)}
.g2{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:20px;align-items:start}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.stack{display:flex;flex-direction:column;gap:20px;min-width:0}

.badge{display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 8px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--neu-soft);color:var(--neu)}
.badge::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.badge.ok{background:var(--ok-soft);color:var(--ok)}.badge.warn{background:var(--warn-soft);color:var(--warn)}.badge.bad{background:var(--bad-soft);color:var(--bad)}.badge.gold{background:var(--gold-soft);color:var(--gold-ink)}

.btn{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:10px;padding:10px 16px;font-weight:700;font-size:14px;text-align:center;line-height:1.2;transition:filter .15s,transform .05s}
.btn:active{transform:translateY(1px)}
.btn:hover{filter:brightness(1.05)}
.btn.primary{background:var(--gold);color:var(--on-gold)}
.btn.dark{background:var(--brand);color:var(--brand-fg)}
.btn.sec{border:1.5px solid var(--brand);color:var(--brand);background:var(--surface)}
:root[data-theme="dark"] .btn.sec{color:var(--fg)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.sec{color:var(--fg)}}
.btn.ghost{border:1.5px solid var(--bad);color:var(--bad);background:var(--surface)}
.btn.sm{padding:6px 12px;font-size:12px;border-radius:999px}
.btn.block{display:flex;width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.link{all:unset;cursor:pointer;color:var(--gold-ink);font-weight:600;font-size:13px}
.link:hover{text-decoration:underline}

.tblwrap{overflow-x:auto;margin:0 -22px;padding:0 22px}
table.tbl{width:100%;border-collapse:collapse;min-width:560px}
.tbl th{background:var(--surface2);text-align:left;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:11px 14px;white-space:nowrap}
.tbl th:first-child{border-radius:6px 0 0 6px}.tbl th:last-child{border-radius:0 6px 6px 0}
.tbl td{padding:12px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
.tbl td.r,.tbl th.r{text-align:right}
.tbl td.m{color:var(--muted);font-size:13px;white-space:nowrap}
.tbl td.b{font-weight:600}
.tbl tr.click{cursor:pointer}.tbl tr.click:hover td{background:var(--surface2)}
.tbl tr.sel td{background:var(--gold-soft)}

.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>span{font-size:12px;font-weight:600;color:var(--muted)}
.in{width:100%;min-width:0;border:1.5px solid var(--border);background:var(--surface);border-radius:8px;padding:10px 12px;outline:none}
.in:focus{border-color:var(--gold)}
.in.err{border-color:var(--bad)}
textarea.in{resize:vertical;min-height:72px}
.row{display:flex;gap:12px;flex-wrap:wrap}.row>*{flex:1 1 140px}
.form{display:flex;flex-direction:column;gap:14px}
.hint{font-size:12px;color:var(--muted)}
.err-msg{font-size:12px;color:var(--bad);font-weight:600}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{all:unset;cursor:pointer;box-sizing:border-box;border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:600}
.pill.on{background:var(--brand);border-color:var(--brand);color:var(--brand-fg)}
.seg{display:flex;border:1px solid var(--border);border-radius:10px;padding:4px;background:var(--surface);gap:4px}
.seg button{all:unset;flex:1;text-align:center;cursor:pointer;padding:8px 10px;border-radius:7px;font-weight:600;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--brand);color:var(--brand-fg)}
.switch{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:10px;font-weight:600;font-size:13px}
.switch i{width:40px;height:24px;border-radius:12px;background:var(--neu-soft);position:relative;transition:background .15s}
.switch i::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s}
.switch.on i{background:var(--brand)}.switch.on i::after{left:19px}
.bar{height:8px;border-radius:4px;background:var(--neu-soft);overflow:hidden}.bar i{display:block;height:100%;border-radius:4px;background:var(--brand)}
.bar.gold i{background:var(--gold)}

.alert{border-radius:10px;padding:12px 14px 12px 16px;border-left:5px solid var(--bad);background:var(--bad-soft)}
.alert.warn{border-color:var(--warn);background:var(--warn-soft)}.alert.ok{border-color:var(--ok);background:var(--ok-soft)}.alert.gold{border-color:var(--gold);background:var(--gold-soft)}
.alert b{display:block;font-size:14px}.alert p{margin:2px 0 0;font-size:13px}.alert small{color:var(--muted);font-size:12px}
.alert.bad b{color:var(--bad)}.alert.warn b{color:var(--warn)}
.list{display:flex;flex-direction:column;gap:10px}
.lrow{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)}
.lrow:last-child{border-bottom:0}
.lrow .grow{flex:1;min-width:0}
.lrow b{display:block;font-size:14px}.lrow small{color:var(--muted);font-size:12px}
.ava{width:38px;height:38px;border-radius:50%;background:var(--neu-soft);color:var(--neu);display:grid;place-items:center;font-weight:700;font-size:12px;flex:none}
.ava.gold{background:var(--gold);color:var(--on-gold)}
.empty{padding:28px 12px;text-align:center;color:var(--muted)}
.kv{display:grid;grid-template-columns:1fr auto;gap:10px 16px;font-size:14px}
.kv span{color:var(--muted)}.kv b{text-align:right;font-variant-numeric:tabular-nums}
.chips-row{display:flex;gap:18px;flex-wrap:wrap;justify-content:space-between}
.chip-c{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--muted);min-width:70px}
.chip-c b{color:var(--fg);font-size:13px}
svg text{font-family:var(--f-ui)}
.ax{fill:var(--muted);font-size:11px}.grid-l{stroke:var(--border)}

/* tables floor */
.floor{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.tile{all:unset;box-sizing:border-box;cursor:pointer;border-radius:14px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:104px;justify-content:center;text-align:center}
.tile b{font-size:15px;font-weight:800}.tile small{font-size:11px;opacity:.85}
.tile .dl{width:28px;height:28px;border-radius:50%;background:#fff;color:#0B3D2E;display:grid;place-items:center;font-size:11px;font-weight:700;margin-top:4px}
.t-a{background:var(--felt);color:#fff}.t-r{background:var(--gold);color:#1A1A1A}.t-c{background:var(--neu-soft);color:var(--muted)}.t-m{background:var(--bad-soft);color:var(--bad)}
.tile.sel{outline:3px solid var(--fg);outline-offset:2px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:14px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:6px}

.gtiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.gt{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px}
.gt h3{font-size:15px}.gt .meta{display:flex;justify-content:space-between;gap:8px;align-items:center}
.gt .m2{display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:12px;color:var(--muted)}.gt .m2 b{display:block;color:var(--fg);font-size:14px}
.seats{display:flex;gap:3px;flex-wrap:wrap}.seats i{width:8px;height:8px;border-radius:50%;background:var(--brand)}.seats i.f{background:transparent;border:1.3px solid var(--brand)}

.cov{display:grid;grid-template-columns:80px repeat(7,minmax(0,1fr));gap:8px;align-items:center;min-width:620px}
.cov .h{text-align:center;font-size:12px;font-weight:700;color:var(--muted)}
.cov .c{border-radius:8px;padding:14px 4px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.c.ok{background:var(--ok-soft);color:var(--ok)}.c.warn{background:var(--warn-soft);color:var(--warn)}.c.bad{background:var(--bad-soft);color:var(--bad)}

.timeline{display:flex;flex-direction:column;gap:14px;border-left:2px solid var(--border);padding-left:16px;margin-left:5px}
.tl{position:relative;font-size:13px}.tl::before{content:"";position:absolute;left:-23px;top:3px;width:12px;height:12px;border-radius:50%;background:var(--gold)}
.tl.bad::before{background:var(--bad)}.tl.ok::before{background:var(--ok)}
.tl b{color:var(--gold-ink);font-size:12px;display:block}

/* modal + toast */
.overlay{position:fixed;inset:0;background:rgba(10,20,16,.55);display:grid;place-items:center;padding:16px;z-index:50}
.modal{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);width:min(560px,100%);max-height:calc(100% - 32px);overflow:auto;padding:24px}
.modal.wide{width:min(860px,100%)}
.modal h2{font-size:18px;margin-bottom:4px}.modal .sub{color:var(--muted);font-size:13px;margin:0 0 16px}
.mfoot{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:12px 18px;border-radius:10px;font-weight:600;z-index:60;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.toast.bad{background:var(--bad);color:#fff}

/* login */
.login{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);min-height:100vh}
.login-brand{background:var(--felt);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:40px 24px;text-align:center;position:relative;overflow:hidden}
.login-brand h1{font-size:clamp(34px,5vw,52px);font-weight:800;letter-spacing:-.02em}
.login-brand p{color:var(--gold);font-size:18px;font-weight:500;margin:0}
.login-brand small{position:absolute;bottom:24px;color:var(--felt-muted);font-size:13px;padding:0 16px}
.login-form{display:grid;place-items:center;padding:32px 16px}
.login-card{width:min(440px,100%);background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:32px}
.login-card h2{font-size:28px;font-weight:800}
.demo{font-size:12px;background:var(--gold-soft);color:var(--gold-ink);border-radius:8px;padding:8px 12px;font-weight:600}

/* player phone */
.pmode{min-height:100%;display:flex;flex-direction:column;align-items:center;gap:16px;padding:20px 16px 40px}
.pbar{width:min(980px,100%);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.phone{width:min(390px,100%);height:min(800px,calc(100vh - 120px));min-height:640px;border-radius:36px;border:10px solid #111;outline:1px solid var(--border);background:var(--bg);overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.pscroll{flex:1;overflow:auto;padding:20px 20px 24px;display:flex;flex-direction:column;gap:14px}
.ptop{background:var(--felt);color:#fff;padding:24px 20px 20px;display:flex;flex-direction:column;gap:12px}
.ptier{background:var(--felt2);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.ptabs{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--border);background:var(--surface)}
.ptabs button{all:unset;cursor:pointer;text-align:center;padding:10px 0 12px;font-size:11px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:4px}
.ptabs button i{width:16px;height:16px;border-radius:50%;border:1.6px solid currentColor}
.ptabs button.on{color:var(--gold-ink)}.ptabs button.on i{background:var(--gold);border-color:var(--gold)}
.promo{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px;display:flex;gap:12px;align-items:center;border-left:4px solid var(--gold)}
.promo .grow{flex:1;min-width:0}.promo b{display:block}.promo small{color:var(--muted);font-size:12px}
.rules-check{display:flex;flex-direction:column;gap:4px;font-size:12px}
.rules-check span{color:var(--muted)}.rules-check span.ok{color:var(--ok);font-weight:600}
.strength{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.strength i{height:6px;border-radius:3px;background:var(--neu-soft)}.strength i.on{background:var(--ok)}

@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.g2,.g3{grid-template-columns:minmax(0,1fr)}}
@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{position:static;height:auto;flex-direction:row;flex-wrap:nowrap;overflow-x:auto;padding:10px 12px;gap:6px;align-items:center}
  .brand{padding:0 8px 0 0}.brand small{display:none}.navsec,.side-foot .status{display:none}
  .nav{white-space:nowrap;padding:8px 10px}.nav.on::before{display:none}
  .side-foot{margin:0;flex-direction:row;padding:0}.side-btn{white-space:nowrap}
  .hdr{position:static;padding:14px 16px}.content{padding:16px 16px 32px}
  .floor{grid-template-columns:repeat(3,minmax(0,1fr))}
  .login{grid-template-columns:minmax(0,1fr)}.login-brand{padding:32px 16px 56px}
}

  <div class="stack">

     ${p.st!=='Activo'?`<div class="alert" style="margin-top:14px"><b>Perfil ${p.st.toLowerCase()} (borrado lógico)</b><p>${esc(p.reason||'')}</p><small>No aparece en la segmentación de campañas ni recibe ofertas de retención. El historial se conserva.</small></div>`:''}
     <div style="margin-top:18px"><div style="display:flex;justify-content:space-between;font-size:12px"><span class="hint" style="font-weight:600">Puntos de lealtad</span><b class="num">${grp(p.points)}${next?` / ${grp(goal)} para ${next}`:' · nivel máximo'}</b></div><div class="bar gold" style="height:10px;margin-top:6px"><i style="width:${next?Math.min(p.points/goal*100,100):100}%"></i></div></div></section>

/* ---------- Catálogo y búsqueda (E-02) ---------- */
const BETS={'Todas':[0,1e12],'Hasta $10.000':[0,10000],'$10.000 – $50.000':[10000,50000],'Más de $50.000':[50001,1e12]};
V.catalogo=()=>{

  const list=liveTables().filter(t=>(u.game==='Todos'||t.game===u.game)&&(!u.free||(t.st==='a'&&t.free>0))&&t.min>=lo&&t.min<=hi&&(!q||(t.id+t.game).toLowerCase().includes(q)));
  const p=player(u.recFor),recs=recommend(p),m=can('tables');
  return `<section class="card" style="display:flex;gap:14px;flex-wrap:wrap;align-items:center"><input class="in" id="g-q" style="flex:1 1 200px;max-width:260px" placeholder="Buscar juego o mesa…" data-bind="ui.gq" value="${esc(u.gq)}"><div class="pills">${['Todos',...GAMES].map(g=>`<button class="pill ${u.game===g?'on':''}" data-act="set" data-k="game" data-arg="${g}">${g}</button>`).join('')}</div><select class="in" id="g-bet" style="width:auto" data-bind="ui.bet">${Object.keys(BETS).map(k=>`<option ${u.bet===k?'selected':''}>${k}</option>`).join('')}</select><button class="switch ${u.free?'on':''}" data-act="toggle" data-k="free"><i></i>Solo con cupo</button>${m?`<button class="btn dark sm" data-act="modal" data-arg="tableForm">+ Registrar mesa</button>`:''}</section>
  <div class="g2"><div class="stack"><p class="hint" style="margin:0">${list.length} mesas encontradas · las mesas retiradas no aparecen en la búsqueda</p><div class="gtiles">${list.map(t=>{const d=staff(t.dealer);const n=Math.min(t.seats,10),occ=n-Math.round(t.free*n/t.seats);return `<article class="gt"><div class="meta"><div><h3>${t.game}</h3><span class="hint">Mesa ${t.id} · ${t.zone}</span></div>${B(t.st==='a'&&!t.free?'Llena':STN[t.st],t.st==='a'&&!t.free?'warn':STK[t.st])}</div><div class="m2"><span>Apuesta<b>${money(t.min)} – ${money(t.max)}</b></span><span>Puestos libres<b>${t.free} de ${t.seats}</b></span></div><div class="seats">${Array.from({length:n},(_,i)=>`<i class="${i<occ?'':'f'}"></i>`).join('')}</div><span class="hint">Crupier: ${d?esc(d.name):t.game==='Tragamonedas'?'Banco de 20 máquinas':'Sin asignar'}</span>${m?`<div style="display:flex;gap:6px"><button class="btn sec sm" data-act="modal" data-arg="tableForm" data-id="${t.id}">Editar</button><button class="btn ghost sm" data-act="modal" data-arg="retireTable" data-id="${t.id}">Retirar</button></div>`:''}</article>`;}).join('')||'<div class="empty">No hay mesas con esos filtros.</div>'}</div></div>
  ${card('Recomendaciones',`<div class="form"><label class="field"><span>Jugador</span><select class="in" id="g-rec" data-bind="ui.recFor">${S.players.filter(x=>x.st==='Activo').map(x=>`<option value="${x.id}" ${x.id===p.id?'selected':''}>${esc(x.name)} · ${tierOf(x)}</option>`).join('')}</select></label><p class="hint" style="margin:0">Hasta 5 mesas según su historial, juegos preferidos y apuesta promedio (${money(p.avg)}).</p>
   <div class="list">${recs.length?recs.map((r,i)=>`<div style="background:var(--surface2);border-radius:10px;padding:12px 14px"><b>${r.t.game} · Mesa ${r.t.id}</b><div class="hint">${esc(r.why)}</div><div style="display:flex;gap:10px;align-items:center;margin-top:8px"><div class="bar ${i===0?'gold':''}" style="flex:1"><i style="width:${Math.round(r.s*100)}%"></i></div><b class="num">${Math.round(r.s*100)}%</b></div></div>`).join(''):'<div class="empty">No hay mesas abiertas con cupo.</div>'}</div>
   <button class="btn primary block" data-act="sendRec" ${recs.length?'':'disabled'}>Enviar recomendación al jugador</button></div>`)}</div>`;
};

/* ---------- Mi mesa (crupier) ---------- */

  const myCert=card('Mi certificación',me?`<div class="kv"><span>Juego</span><b>${me.game}</b><span>Último examen</span><b>${dmy(me.last)} · ${me.score}</b><span>Vence</span><b>${dmy(me.exp)}</b><span>Estado</span><b>${B(c,k)}</b></div>`:'<div class="empty">Tu cuenta no está vinculada a un empleado.</div>');
  if(!t)return `<div class="g2">${card('Sin mesa asignada',`<div class="empty">El jefe de piso aún no te asigna una mesa abierta. ${c==='Vencida'||c==='Revocada'?'Tu certificación no está vigente: no puedes ser asignado hasta aprobar el examen.':''}</div>`)}${myCert}</div>`;

  `<div class="g2"><section class="card"><div class="card-h"><div><h2>Jugadores en la mesa</h2><p>Marca una señal de retiro y el sistema decide si aplica una oferta de retención.</p></div><button class="btn dark sm" data-act="modal" data-arg="seat" ${t.free?'':'disabled'}>+ Sentar jugador</button></div>
   ${t.seated.length?t.seated.map((s,i)=>{const p=player(s.pid);return `<div class="seatrow"><span class="seatno">${i+1}</span><div><b>${esc(p?p.name:s.anon)}</b><small>${p?tierOf(p)+' · '+p.prefs.join(', '):'Sin perfil registrado'}</small>${s.sig.length?`<div class="sig" style="margin-top:4px">${s.sig.map(x=>B(x,'warn')).join('')}</div>`:''}</div><div><small>En la mesa</small><b class="num">${s.min} min</b></div><div><small>Buy-in</small><b class="num">${money(s.buyin)}</b></div><div class="seatacts"><button class="btn sec sm" data-act="signal" data-arg="${i}" data-s="Cambio a fichas grandes" ${R.colorup?'':'disabled'}>Cambio a fichas grandes</button><button class="btn sec sm" data-act="signal" data-arg="${i}" data-s="Quiere retirarse" ${R.salida?'':'disabled'}>Quiere retirarse</button><button class="btn ghost sm" data-act="leave" data-arg="${i}">Se retiró</button></div></div>`;}).join(''):'<div class="empty">No hay jugadores sentados.</div>'}
  </section>
  <div class="stack">${card('Acciones de mesa',`<div class="form"><button class="btn primary block" data-act="modal" data-arg="fillReq" data-id="${t.id}" ${t.st==='r'?'disabled':''}>${t.st==='r'?'Relleno ya solicitado':'Solicitar relleno de fichas'}</button><p class="hint" style="margin:0">Apuesta permitida: ${money(t.min)} – ${money(t.max)}. Abrir, cerrar o cambiar crupier lo hace el jefe de piso.</p></div>`)}
  ${card('Retención activa',`<div class="list"><div class="lrow"><div class="grow"><b>Cambio a fichas grandes</b><small>El jugador pide fichas de mayor valor para irse</small></div>${B(R.colorup?'Activa':'Apagada',R.colorup?'ok':'')}</div><div class="lrow"><div class="grow"><b>Quiere retirarse</b><small>El jugador avisa que se va</small></div>${B(R.salida?'Activa':'Apagada',R.salida?'ok':'')}</div></div><p class="hint" style="margin:8px 0 0">Mínimo ${S.ret.minMin} min en la mesa · ${S.ret.perDay} oferta por jugador al día · nunca a jugadores autoexcluidos.</p>`)}
  ${myCert}</div></div>`;
};

/* ---------- Operación de mesas (pit) ---------- */
V.mesas=()=>{
  const zone=liveTables().filter(t=>t.id.startsWith('M-')),t=table(S.ui.table)&&table(S.ui.table).st!=='x'?table(S.ui.table):zone[0],d=staff(t.dealer);
  const open=zone.filter(x=>x.st==='a'||x.st==='r').length,drop=zone.reduce((s,x)=>s+x.drop,0);
  const games=['Blackjack','Ruleta','Póker','Baccarat','Craps'].map(g=>[g,zone.filter(x=>x.game===g).reduce((s,x)=>s+x.drop,0)]).sort((a,b)=>b[1]-a[1]);const gmax=Math.max(1,games[0][1]);
  const fill=S.fills.find(f=>f.table===t.id);let actions='';
  if(t.st==='a')actions=`<button class="btn primary block" data-act="modal" data-arg="fillReq" data-id="${t.id}">Solicitar relleno</button><button class="btn sec block" data-act="modal" data-arg="dealer">Cambiar crupier</button><button class="btn ghost block" data-act="modal" data-arg="closeTable">Cerrar mesa</button>`;
  if(t.st==='r')actions=`<button class="btn primary block" data-act="approveFill" data-arg="${t.id}">Aprobar relleno de ${money(fill?fill.amount:0)}</button><button class="btn sec block" data-act="modal" data-arg="dealer">Cambiar crupier</button>`;
  if(t.st==='c')actions=`<button class="btn primary block" data-act="modal" data-arg="dealer" data-open="1">Abrir mesa y asignar crupier</button><button class="btn sec block" data-act="tableMaint" data-arg="${t.id}">Enviar a mantenimiento</button>`;
  if(t.st==='m')actions=`<button class="btn primary block" data-act="tableFixed" data-arg="${t.id}">Marcar como reparada</button>`;
  return kpis([['Mesas abiertas',open+' / '+zone.length,(zone.length-open)+' cerradas o en mantenimiento'],['Drop del turno',money(drop),'+6% vs. turno anterior','ok'],['Rellenos pendientes',S.fills.length,S.fills.length?'Requieren aprobación':'Al día',S.fills.length?'warn':'ok'],['Hold promedio','17,8%','Meta: 16% – 20%','ok']])+
  `<div class="g2"><div class="stack">${card('Mapa del piso · Zona A',`<div class="floor">${zone.map(x=>{const dd=staff(x.dealer);return `<button class="tile t-${x.st} ${x.id===t.id?'sel':''}" data-act="set" data-k="table" data-arg="${x.id}" aria-label="Mesa ${x.id} ${STN[x.st]}"><b>${x.id}</b><small>${x.game}</small>${dd?`<span class="dl">${ini(dd.name)}</span>`:`<small>${x.st==='m'?'Mantenimiento':'Cerrada'}</small>`}</button>`;}).join('')}</div><div class="legend"><span><i style="background:var(--felt)"></i>Abierta</span><span><i style="background:var(--gold)"></i>Relleno solicitado</span><span><i style="background:var(--neu-soft)"></i>Cerrada</span><span><i style="background:var(--bad-soft)"></i>Mantenimiento</span></div>`,'<span class="hint">Toca una mesa para ver su detalle</span>')}
  ${card('Drop por juego · turno actual',`<div class="list">${games.map(([g,v])=>`<div style="display:grid;grid-template-columns:90px 1fr 80px;gap:10px;align-items:center"><span>${g}</span><div class="bar" style="height:10px"><i style="width:${v/gmax*100}%"></i></div><b class="num" style="text-align:right">${mm(v)}</b></div>`).join('')}</div>`)}</div>
  <div class="stack">${card(`Mesa ${t.id} · ${t.game}`,`<div class="kv"><span>Crupier</span><b>${d?esc(d.name)+' '+B(cert(d)[0],cert(d)[1]):'Sin asignar'}</b><span>Apertura</span><b>${t.opened?t.opened+' con '+money(t.openAmt):'—'}</b><span>Rellenos del turno</span><b>${t.fills}</b><span>Drop actual</span><b>${money(t.drop)}</b><span>Win estimado (hold 18%)</span><b>${money(t.drop*.18)}</b><span>Fichas en mesa</span><b>${grp(t.chips)}</b></div><div class="form" style="margin-top:16px">${actions}</div>`,B(STN[t.st],STK[t.st]))}
  ${card('Solicitudes de relleno',S.fills.length?`<div class="list">${S.fills.map(f=>`<div class="lrow"><div class="grow"><b>${f.table} · ${table(f.table).game} · ${money(f.amount)}</b><small>Solicitado ${f.time} por ${esc(f.by)}</small></div><button class="btn dark sm" data-act="approveFill" data-arg="${f.table}">Aprobar</button></div>`).join('')}</div>`:'<div class="empty">No hay rellenos pendientes.</div>')}</div></div>`;
};

/* ---------- Promociones (E-03) ---------- */
const CSK={Borrador:'gold',Activa:'ok',Finalizada:'',Cancelada:'bad'};
V.promociones=()=>{
  const u=S.ui,act=S.campaigns.filter(c=>c.status==='Activa'),el=act.reduce((s,c)=>s+c.elig,0),red=act.reduce((s,c)=>s+c.red,0),m=can('camps');
  const list=S.campaigns.filter(c=>u.cst==='Todas'||c.status===u.cst);
  const actions=c=>!m?'':c.status==='Borrador'?`<button class="btn sec sm" data-act="editCamp" data-arg="${c.id}">Modificar</button> <button class="btn dark sm" data-act="activate" data-arg="${c.id}">Activar</button> <button class="btn ghost sm" data-act="modal" data-arg="campCancel" data-id="${c.id}">Cancelar</button>`:c.status==='Activa'?`<button class="btn sec sm" data-act="modal" data-arg="campEdit" data-id="${c.id}">Modificar</button> <button class="btn ghost sm" data-act="modal" data-arg="campCancel" data-id="${c.id}">Cancelar</button>`:c.status==='Finalizada'?`<button class="btn sec sm" data-act="duplicate" data-arg="${c.id}">Duplicar</button>`:`<span class="hint">${esc(c.cancel||'')}</span>`;
  const wk=['17/08','24/08','31/08','07/09','14/09','21/09','28/09','05/10'],vals=[12,14,13,16,17,19,18,+(red/el*100).toFixed(1)];
  const W=640,H=230,b=190,sc=(b-20)/25,pts=vals.map((v,i)=>[60+i*80,b-Math.min(v,25)*sc]);
  const chart=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Tasa de redención semanal">${[0,5,10,15,20,25].map(v=>`<line class="grid-l" x1="44" x2="${W}" y1="${b-v*sc}" y2="${b-v*sc}"/><text class="ax" x="38" y="${b-v*sc+4}" text-anchor="end">${v}%</text>`).join('')}<line x1="44" x2="${W}" y1="${b-15*sc}" y2="${b-15*sc}" stroke="var(--gold)" stroke-width="2" stroke-dasharray="6 4"/><text x="${W-4}" y="${b-15*sc-6}" text-anchor="end" font-size="11" fill="var(--gold-ink)">Meta 15%</text><polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="var(--brand)" stroke-width="2.5" stroke-linejoin="round"/>${pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="5" fill="${i===7?'var(--gold)':'var(--surface)'}" stroke="var(--brand)" stroke-width="2"/><text class="ax" x="${p[0]}" y="${b+22}" text-anchor="middle">${wk[i]}</text>${i===7?`<text x="${p[0]}" y="${p[1]-12}" text-anchor="middle" font-size="12" font-weight="700" fill="var(--fg)">${String(vals[7]).replace('.',',')}%</text>`:''}`).join('')}</svg>`;
  return kpis([['Campañas activas',act.length,S.campaigns.filter(c=>c.status==='Borrador').length+' en borrador'],['Redenciones (activas)',grp(red),'+14% vs. septiembre','ok'],['Tasa de redención',pct(red/el),'Redenciones / jugadores elegibles','ok'],['Canceladas',S.campaigns.filter(c=>c.status==='Cancelada').length,'Con justificación registrada']])+

   <div class="row"><label class="field"><span>Sesión mínima (min)</span><input class="in num" name="minMin" id="rc-m" inputmode="numeric" value="${R.minMin}" ${m?'':'disabled'}></label><label class="field"><span>Ofertas por jugador al día</span><input class="in num" name="perDay" id="rc-p" inputmode="numeric" value="${R.perDay}" ${m?'':'disabled'}></label></div>
   ${m?'<button class="btn sec block" type="submit">Guardar configuración</button>':''}</form>`,'','Sugerida por nivel: Bronce y Plata → descuento · Oro → fichas de bono · Diamante → bono para reclamar')}

   ${card('Fichas entregadas hoy por denominación',`<div class="chips-row">${DENOMS.map(dn=>`<div class="chip-c">${chipSVG(dn,28)}<b>${money(dn[0])}</b>${grp(S.delivered[dn[0]])} und.</div>`).join('')}</div>`)}</div>

V.inventario=()=>{
  const tabs=liveTables().filter(t=>t.minChips);const st=t=>t.chips<t.minChips?['Crítico','bad']:t.chips<t.minChips*1.15?['Bajo','warn']:['Normal','ok'];
  const crit=tabs.filter(t=>st(t)[0]==='Crítico'),low=DENOMS.filter(([v])=>S.vault[v]<1000);
  const vaultVal=DENOMS.reduce((s,[v])=>s+v*S.vault[v],0),circ=tabs.reduce((s,t)=>s+t.chips,0);
  const W=640,H=230,b=190,mx=5000,sc=(b-20)/mx;
  const chart=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Fichas en bóveda por denominación">${[0,1000,2000,3000,4000,5000].map(v=>`<line class="grid-l" x1="50" x2="${W}" y1="${b-v*sc}" y2="${b-v*sc}"/><text class="ax" x="44" y="${b-v*sc+4}" text-anchor="end">${grp(v)}</text>`).join('')}<line x1="50" x2="${W}" y1="${b-1000*sc}" y2="${b-1000*sc}" stroke="var(--bad)" stroke-width="1.5" stroke-dasharray="6 4"/>${DENOMS.map(([v],i)=>{const n=Math.min(S.vault[v],mx),h=Math.max(n*sc,2),x=80+i*95;return `<rect x="${x}" y="${b-h}" width="56" height="${h}" rx="6" fill="${S.vault[v]<1000?'var(--bad)':'var(--brand)'}"/><text x="${x+28}" y="${b-h-8}" text-anchor="middle" font-size="12" font-weight="700" fill="var(--fg)">${grp(S.vault[v])}</text><text class="ax" x="${x+28}" y="${b+20}" text-anchor="middle">${money(v)}</text>`;}).join('')}</svg>`;
  return kpis([['Fichas en mesas',grp(circ),tabs.length+' mesas'],['Valor en bóveda',money(vaultVal),'Último conteo 18:00'],['Mesas activas',tabs.filter(t=>t.st==='a'||t.st==='r').length+' / '+tabs.length,'Zona A'],['Alertas de stock',crit.length+low.length,'Requieren reposición',crit.length+low.length?'bad':'ok']])+
  `<div class="g2">${card('Stock de fichas por mesa',`<div class="tblwrap"><table class="tbl"><thead><tr><th>Mesa</th><th>Juego</th><th class="r">Fichas</th><th class="r">Mínimo</th><th>Último conteo</th><th>Estado</th><th></th></tr></thead><tbody>${tabs.map(t=>{const [l,k]=st(t);return `<tr><td class="b">${t.id}</td><td>${t.game}</td><td class="r b">${grp(t.chips)}</td><td class="r">${grp(t.minChips)}</td><td class="m">Hoy ${t.count}</td><td>${B(l,k)}</td><td>${l!=='Normal'?`<button class="btn dark sm" data-act="restock" data-arg="${t.id}">Reponer</button>`:''}</td></tr>`;}).join('')}</tbody></table></div>`,`<button class="btn dark sm" data-act="modal" data-arg="count">+ Registrar conteo</button>`)}
  ${card('Alertas de stock',crit.length+low.length?`<div class="list">${crit.map(t=>`<div class="alert"><b>Mesa ${t.id} · ${t.game}</b><p>${grp(t.chips)} fichas · mínimo ${grp(t.minChips)}</p><button class="btn dark sm" style="margin-top:8px" data-act="restock" data-arg="${t.id}">Reponer</button></div>`).join('')}${low.map(([v])=>`<div class="alert warn"><b>Bóveda · fichas de ${money(v)}</b><p>${grp(S.vault[v])} und. · umbral 1.000</p><button class="btn dark sm" style="margin-top:8px" data-act="vaultOrder" data-arg="${v}">Pedir al proveedor</button></div>`).join('')}</div>`:'<div class="empty">Todo el stock está sobre el mínimo.</div>')}</div>

  tableForm:m=>{const t=m.id?table(m.id):null,v={...tblFormDefaults,...(t||{}),...(m.v||{})};return `<h2>${t?'Actualizar mesa '+t.id:'Registrar mesa'}</h2><p class="sub">${t?'HU-JUE-03 · El cambio se ve de inmediato en la búsqueda.':'HU-JUE-01 · Número único, apuesta mínima menor que la máxima, inicia Cerrada.'}</p><form class="form" data-form="tableForm"><input type="hidden" name="edit" value="${t?t.id:''}"><div class="row"><label class="field"><span>Número de mesa</span><input class="in" name="id" id="tf-id" value="${esc(v.id)}" placeholder="M-19" ${t?'readonly':''}></label><label class="field"><span>Juego</span><select class="in" name="game" id="tf-g" ${t?'disabled':''}>${GAMES.map(g=>`<option ${v.game===g?'selected':''}>${g}</option>`).join('')}</select></label><label class="field"><span>Ubicación</span><select class="in" name="zone" id="tf-z">${['Zona A','Zona B','Salón VIP'].map(z=>`<option ${v.zone===z?'selected':''}>${z}</option>`).join('')}</select></label></div><div class="row"><label class="field"><span>Apuesta mínima ($)</span><input class="in num" type="number" name="min" id="tf-min" value="${v.min}"></label><label class="field"><span>Apuesta máxima ($)</span><input class="in num" type="number" name="max" id="tf-max" value="${v.max}"></label>${t?`<label class="field"><span>Estado</span><select class="in" name="st" id="tf-st">${['a','c','m'].map(s=>`<option value="${s}" ${(v.st==='r'?'a':v.st)===s?'selected':''}>${STN[s]}</option>`).join('')}</select></label>`:''}</div>${m.err?`<p class="err-msg">${esc(m.err)}</p>`:''}<div class="mfoot"><button type="button" class="btn sec" data-act="closeModal">Cancelar</button><button class="btn primary" type="submit">${t?'Guardar':'Registrar mesa'}</button></div></form>`;},
  retireTable:m=>{const t=table(m.id);return `<h2>Retirar mesa ${t.id}</h2><p class="sub">HU-JUE-04 · Borrado lógico: deja de aparecer en búsquedas y recomendaciones, pero su historial se conserva.</p>${t.st==='a'||t.st==='r'?`<div class="alert"><b>No se puede retirar</b><p>La mesa está abierta. Ciérrala primero en Operación de mesas.</p></div><div class="mfoot"><button class="btn sec" data-act="closeModal">Entendido</button></div>`:`<form class="form" data-form="retireTable"><input type="hidden" name="id" value="${t.id}"><label class="field"><span>Motivo</span><input class="in" name="reason" id="rt-r" placeholder="Mesa dañada sin reparación"></label><div class="mfoot"><button type="button" class="btn sec" data-act="closeModal">Cancelar</button><button class="btn ghost" type="submit">Retirar mesa</button></div></form>`}`;},
  seat:m=>{const t=S.tables.find(x=>x.dealer===cur().sid);const seatedIds=S.tables.flatMap(x=>x.seated.map(s=>s.pid)).filter(Boolean);return `<h2>Sentar jugador · ${t.id}</h2><p class="sub">${t.game} · apuesta ${money(t.min)} – ${money(t.max)}</p><form class="form" data-form="seat"><label class="field"><span>Jugador (escanea su tarjeta)</span><select class="in" name="pid" id="st-p">${S.players.filter(p=>p.st==='Activo'&&!seatedIds.includes(p.id)).map(p=>`<option value="${p.id}">${esc(p.name)} · ${tierOf(p)}</option>`).join('')}<option value="">Jugador sin tarjeta</option></select></label><label class="field"><span>Buy-in en la mesa ($)</span><input class="in num" type="number" name="buyin" id="st-b" value="500000" min="${t.min}"></label>${m.err?`<p class="err-msg">${esc(m.err)}</p>`:''}<div class="mfoot"><button type="button" class="btn sec" data-act="closeModal">Cancelar</button><button class="btn primary" type="submit">Sentar</button></div></form>`;},
  ret:m=>{const p=player(m.pid),chk=retCheck(p,m.min),rec=p?recOffer(p):null;return `<h2>Señal de retiro detectada</h2><p class="sub">${esc(m.sig)} · ${esc(m.origin)} · ${esc(p?p.name:'Jugador sin tarjeta')}${p?' · '+tierOf(p):''} · ${m.min} min de sesión</p>${chk.ok?`<div class="offers">${Object.keys(OFFERS).map(k=>`<div class="offer ${k===rec?'rec':''}">${k===rec?'<span class="tag">Sugerida para su nivel</span>':'<span class="tag" style="color:var(--muted)">Opción</span>'}<b>${offerName(k)}</b><p>${OFFERS[k].d()}</p><button class="btn ${k===rec?'primary':'sec'} block" data-act="retAccept" data-arg="${k}">El jugador aceptó</button></div>`).join('')}</div><div class="mfoot"><button class="btn sec" data-act="retReject">No aceptó ninguna</button></div>`:`<div class="alert"><b>No se ofrece retención</b><p>${esc(chk.why)}</p></div><div class="mfoot"><button class="btn primary" data-act="retBlocked">Registrar y cerrar</button></div>`}`;},
  campEdit:m=>{const c=S.campaigns.find(x=>x.id===m.id);return `<h2>Modificar campaña activa</h2><p class="sub">HU-PRO-03 · En una campaña activa solo se amplía la fecha de fin o se edita la descripción.</p><form class="form" data-form="campEdit"><input type="hidden" name="id" value="${c.id}"><label class="field"><span>Campaña</span><input class="in" value="${esc(c.name)}" readonly></label><label class="field"><span>Descripción</span><textarea class="in" name="desc" id="ce-d">${esc(c.desc)}</textarea></label><label class="field"><span>Fecha de fin (actual ${dmy(c.end)})</span><input class="in" type="date" name="end" id="ce-e" value="${c.end}"></label>${m.err?`<p class="err-msg">${esc(m.err)}</p>`:''}<div class="mfoot"><button type="button" class="btn sec" data-act="closeModal">Cancelar</button><button class="btn primary" type="submit">Guardar</button></div></form>`;},
  campCancel:m=>{const c=S.campaigns.find(x=>x.id===m.id);return `<h2>Cancelar campaña</h2><p class="sub">HU-PRO-04 · ${esc(c.name)}. Se bloquean nuevas redenciones; las ya hechas se conservan.</p><form class="form" data-form="campCancel"><input type="hidden" name="id" value="${c.id}"><label class="field"><span>Justificación (obligatoria)</span><textarea class="in" name="reason" id="cc-r"></textarea></label>${m.err?`<p class="err-msg">${esc(m.err)}</p>`:''}<div class="mfoot"><button type="button" class="btn sec" data-act="closeModal">Volver</button><button class="btn ghost" type="submit">Cancelar campaña</button></div></form>`;},
  revoke:m=>{const s=staff(m.id);return `<h2>Revocar certificación</h2><p class="sub">HU-PER-05 · ${esc(s.name)} · ${s.game}. El empleado queda No habilitado y sale de su mesa.</p><form class="form" data-form="revoke"><input type="hidden" name="id" value="${s.id}"><label class="field"><span>Motivo (obligatorio)</span><textarea class="in" name="reason" id="rv-r"></textarea></label>${m.err?`<p class="err-msg">${esc(m.err)}</p>`:''}<div class="mfoot"><button type="button" class="btn sec" data-act="closeModal">Cancelar</button><button class="btn ghost" type="submit">Revocar</button></div></form>`;},
  employee:m=>{const v=m.v||{};return `<h2>Registrar empleado</h2><p class="sub">HU-PER-01 · Las certificaciones exigidas se derivan del cargo.</p><form class="form" data-form="employee"><label class="field"><span>Nombre completo</span><input class="in" name="name" id="em-n" value="${esc(v.name)}"></label><label class="field"><span>Número de documento</span><input class="in" name="doc" id="em-d" value="${esc(v.doc)}"></label><div class="row"><label class="field"><span>Cargo</span><select class="in" name="role" id="em-r">${['Crupier','Cajero','Jefe de piso'].map(o=>`<option ${v.role===o?'selected':''}>${o}</option>`).join('')}</select></label><label class="field"><span>Juego (crupier)</span><select class="in" name="game" id="em-g">${['Blackjack','Ruleta','Póker','Baccarat','Craps'].map(o=>`<option ${v.game===o?'selected':''}>${o}</option>`).join('')}</select></label></div>${m.err?`<p class="err-msg">${esc(m.err)}</p>`:''}<div class="mfoot"><button type="button" class="btn sec" data-act="closeModal">Cancelar</button><button class="btn primary" type="submit">Registrar</button></div></form>`;},
  csv:m=>`<h2>${esc(m.title)}</h2><p class="sub">${esc(m.sub)}</p><textarea class="in code" id="csv-out" readonly>${esc(m.csv)}</textarea><div class="mfoot"><button class="btn sec" data-act="closeModal">Cerrar</button><button class="btn primary" data-act="copyCSV">Copiar</button></div>`,
  sched:m=>{const r=m.id?S.sched.find(x=>x.id===m.id):{name:'',freq:'Semanal',to:''};const v={...r,...(m.v||{})};return `<h2>${m.id?'Modificar reporte programado':'Programar reporte'}</h2><p class="sub">${m.id?'HU-REP-03 · Aplica desde el próximo envío.':'HU-REP-02 · Se envía en PDF por correo.'}</p><form class="form" data-form="sched"><input type="hidden" name="id" value="${m.id||''}"><label class="field"><span>Reporte</span><input class="in" name="name" id="sc-n" value="${esc(v.name)}" placeholder="Retención semanal" ${m.id?'readonly':''}></label><div class="field"><span>Frecuencia</span><select class="in" name="freq" id="sc-f">${['Diaria','Semanal','Mensual'].map(o=>`<option ${v.freq===o?'selected':''}>${o}</option>`).join('')}</select></div><label class="field"><span>Destinatarios (separados por coma)</span><input class="in" name="to" id="sc-t" value="${esc(v.to)}"></label>${m.err?`<p class="err-msg">${esc(m.err)}</p>`:''}<div class="mfoot"><button type="button" class="btn sec" data-act="closeModal">Cancelar</button><button class="btn primary" type="submit">Guardar</button></div></form>`;},
  schedDel:m=>{const r=S.sched.find(x=>x.id===m.id);return `<h2>¿Eliminar "${esc(r.name)}"?</h2><p class="sub">HU-REP-04 · Se deja de enviar. Los envíos anteriores quedan en el historial.</p><div class="mfoot"><button class="btn sec" data-act="closeModal">Cancelar</button><button class="btn ghost" data-act="schedDel" data-arg="${r.id}">Eliminar</button></div>`;},
  userNew:m=>{const v=m.v||{role:'crupier'};const free=S.staff.filter(s=>!S.users.some(u=>u.sid===s.id));return `<h2>Crear usuario</h2><p class="sub">HU-ADM-01 · Se genera una contraseña temporal que se cambia en el primer ingreso.</p><form class="form" data-form="userNew"><label class="field"><span>Nombre completo</span><input class="in" name="name" id="un-n" value="${esc(v.name)}"></label><label class="field"><span>Correo</span><input class="in" name="email" id="un-e" inputmode="email" value="${esc(v.email)}" placeholder="nombre.apellido@pitboss.co"></label><div class="row"><label class="field"><span>Rol</span><select class="in" name="role" id="un-r">${Object.entries(ROLES).map(([k,r])=>`<option value="${k}" ${v.role===k?'selected':''}>${r.l}</option>`).join('')}</select></label><label class="field"><span>Empleado vinculado (crupier y cajero)</span><select class="in" name="sid" id="un-s"><option value="">Ninguno</option>${free.map(s=>`<option value="${s.id}" ${v.sid===s.id?'selected':''}>${esc(s.name)} · ${s.role}</option>`).join('')}</select></label></div>${m.err?`<p class="err-msg">${esc(m.err)}</p>`:''}<div class="mfoot"><button type="button" class="btn sec" data-act="closeModal">Cancelar</button><button class="btn primary" type="submit">Crear usuario</button></div></form>`;},
  userRole:m=>{const x=userById(m.id);return `<h2>Cambiar rol</h2><p class="sub">HU-ADM-03 · ${esc(x.name)}. Aplica en su siguiente acción en el sistema.</p><form class="form" data-form="userRole"><input type="hidden" name="id" value="${x.id}"><label class="field"><span>Rol</span><select class="in" name="role" id="ur-r">${Object.entries(ROLES).map(([k,r])=>`<option value="${k}" ${x.role===k?'selected':''}>${r.l}</option>`).join('')}</select></label><div class="mfoot"><button type="button" class="btn sec" data-act="closeModal">Cancelar</button><button class="btn primary" type="submit">Guardar</button></div></form>`;},
  userOff:m=>{const x=userById(m.id),lastAdmin=x.role==='admin'&&S.users.filter(u=>u.role==='admin'&&u.st==='Activo').length===1;return `<h2>Desactivar a ${esc(x.name)}</h2><p class="sub">HU-ADM-04 · Borrado lógico: se cierran sus sesiones y no puede volver a entrar.</p>${lastAdmin?`<div class="alert"><b>No se puede desactivar</b><p>Es el último administrador activo.</p></div><div class="mfoot"><button class="btn sec" data-act="closeModal">Entendido</button></div>`:`<div class="mfoot"><button class="btn sec" data-act="closeModal">Cancelar</button><button class="btn ghost" data-act="userOff" data-arg="${x.id}">Desactivar</button></div>`}`;},
  closeShift:()=>{const today=S.tx.filter(t=>t.date===TODAY&&!t.caja&&t.status!=='Anulada');const c=today.filter(t=>t.type==='Compra').reduce((s,t)=>s+t.amount-(t.disc||0),0),p=today.filter(t=>t.type==='Pago').reduce((s,t)=>s+t.amount,0),exp=50000000+c-p;return `<h2>Cerrar turno · Caja 2</h2><p class="sub">Cuadre de efectivo del turno tarde.</p><form class="form" data-form="closeShift"><div class="kv"><span>Base de apertura</span><b>${money(50000000)}</b><span>Compras de fichas (cobrado)</span><b>${money(c)}</b><span>Pagos a jugadores</span><b>-${money(p)}</b><span>Efectivo esperado</span><b>${money(exp)}</b></div><input type="hidden" name="exp" value="${exp}"><label class="field"><span>Efectivo contado ($)</span><input class="in num" type="number" name="counted" id="cs-c" value="${exp}"></label><div class="mfoot"><button type="button" class="btn sec" data-act="closeModal">Cancelar</button><button class="btn primary" type="submit">Cerrar turno</button></div></form>`;},
  count:()=>`<h2>Registrar conteo</h2><p class="sub">Conteo físico de fichas en mesa.</p><form class="form" data-form="count"><label class="field"><span>Mesa</span><select class="in" name="t" id="ct-t">${liveTables().filter(t=>t.minChips).map(t=>`<option value="${t.id}">${t.id} · ${t.game} (${grp(t.chips)})</option>`).join('')}</select></label><label class="field"><span>Fichas contadas</span><input class="in num" type="number" min="0" name="n" id="ct-n" value="700"></label><div class="mfoot"><button type="button" class="btn sec" data-act="closeModal">Cancelar</button><button class="btn primary" type="submit">Guardar conteo</button></div></form>`,
  fillReq:m=>{const t=table(m.id||S.ui.table);return `<h2>Solicitar relleno · ${t.id}</h2><p class="sub">${t.game} · ${grp(t.chips)} fichas en mesa</p><form class="form" data-form="fillReq"><input type="hidden" name="id" value="${t.id}"><label class="field"><span>Monto del relleno</span><select class="in" name="a" id="fr-a">${[2000000,5000000,10000000,15000000].map(v=>`<option value="${v}" ${v===5000000?'selected':''}>${money(v)}</option>`).join('')}</select></label><div class="mfoot"><button type="button" class="btn sec" data-act="closeModal">Cancelar</button><button class="btn primary" type="submit">Enviar solicitud</button></div></form>`;},
  dealer:m=>{const t=table(S.ui.table);const ds=S.staff.filter(s=>s.role==='Crupier');return `<h2>${m.open?'Abrir mesa':'Cambiar crupier'} · ${t.id}</h2><p class="sub">${t.game}. Solo se asigna personal con certificación vigente en este juego.</p><form class="form" data-form="dealer"><input type="hidden" name="open" value="${m.open?1:''}"><label class="field"><span>Crupier</span><select class="in" name="sid" id="dl-s">${ds.map(s=>{const [c]=cert(s);return `<option value="${s.id}" ${s.id===(m.sid||'s2')?'selected':''}>${esc(s.name)} · ${s.game} · ${c}${s.area!=='Sin asignar'?' · en '+s.area:''}</option>`;}).join('')}</select></label>${m.err?`<div class="alert"><b>Asignación bloqueada</b><p>${esc(m.err)}</p></div>`:''}<div class="mfoot"><button type="button" class="btn sec" data-act="closeModal">Cancelar</button><button class="btn primary" type="submit">Asignar</button></div></form>`;},
  closeTable:()=>{const t=table(S.ui.table);return `<h2>¿Cerrar la mesa ${t.id}?</h2><p class="sub">Se registra el cierre con drop de ${money(t.drop)} y el crupier queda libre.</p><div class="mfoot"><button class="btn sec" data-act="closeModal">Cancelar</button><button class="btn ghost" data-act="doCloseTable">Cerrar mesa</button></div>`;},
  shift:m=>`<h2>Asignar turno</h2><p class="sub">El sistema valida la certificación antes de asignar una mesa.</p><form class="form" data-form="shift"><label class="field"><span>Empleado</span><select class="in" name="sid" id="sh-s">${S.staff.map(s=>`<option value="${s.id}" ${s.id===(m.sid||'s2')?'selected':''}>${esc(s.name)} · ${s.role} · ${s.game} (${cert(s)[0]})</option>`).join('')}</select></label><div class="row"><label class="field"><span>Turno</span><select class="in" name="shift" id="sh-t">${['Mañana','Tarde','Noche'].map(o=>`<option ${(m.shift||'Tarde')===o?'selected':''}>${o}</option>`).join('')}</select></label><label class="field"><span>Área / Mesa</span><select class="in" name="area" id="sh-a">${liveTables().filter(t=>t.id.startsWith('M-')).map(t=>`<option value="${t.id}" ${t.id===(m.area||'M-05')?'selected':''}>${t.id} · ${t.game}</option>`).join('')}${['Caja 1','Caja 2','Piso A'].map(o=>`<option ${m.area===o?'selected':''}>${o}</option>`).join('')}</select></label></div>${m.err?`<div class="alert"><b>Asignación bloqueada</b><p>${esc(m.err)}</p></div>`:''}<div class="mfoot"><button type="button" class="btn sec" data-act="closeModal">Cancelar</button><button class="btn primary" type="submit">Asignar turno</button></div></form>`,
  payroll:()=>{const pr=payroll();return `<h2>Nómina de octubre · cálculo</h2><p class="sub">Salario base, recargo nocturno del 35% y aportes del empleado a salud (4%) y pensión (4%). Valores de ejemplo.</p><div class="tblwrap"><table class="tbl"><thead><tr><th>Empleado</th><th>Turno</th><th class="r">Base</th><th class="r">Recargo</th><th class="r">Aportes</th><th class="r">Neto</th></tr></thead><tbody>${pr.map(r=>`<tr><td class="b">${esc(r.s.name)}</td><td class="m">${r.s.shift}</td><td class="r">${money(r.base)}</td><td class="r">${r.noct?money(r.noct):'—'}</td><td class="r">-${money(r.ded)}</td><td class="r b">${money(r.net)}</td></tr>`).join('')}<tr><td class="b" colspan="5">Total neto</td><td class="r b">${money(pr.reduce((a,b)=>a+b.net,0))}</td></tr></tbody></table></div><div class="mfoot"><button class="btn sec" data-act="closeModal">Cerrar</button><button class="btn primary" data-act="approvePayroll">Aprobar nómina</button></div>`;},
  report:m=>`<h2>Reporte de desempeño</h2><p class="sub">${esc(m.camp)} · ${esc(m.period)} · ${esc(m.fmt)}</p><div class="tblwrap"><table class="tbl"><thead><tr><th>Campaña</th><th class="r">Elegibles</th><th class="r">Redenciones</th><th class="r">Tasa</th><th>Estado</th></tr></thead><tbody>${m.rows.map(c=>`<tr><td class="b">${esc(c.name)}</td><td class="r">${grp(c.elig)}</td><td class="r">${grp(c.red)}</td><td class="r b">${c.elig?pct(c.red/c.elig):'—'}</td><td>${esc(c.status)}</td></tr>`).join('')}</tbody></table></div><p class="hint">En el sistema real se descarga el archivo ${esc(m.fmt)}.</p><div class="mfoot"><button class="btn sec" data-act="closeModal">Cerrar</button></div>`,
  reportView:m=>{const r=S.reports.find(x=>x.id===m.id);const ov=overTh();return `<h2>${esc(r.name)}</h2><p class="sub">${r.to} · ${r.period} · ${B(r.st,'ok')}</p><div class="kv"><span>Transacciones incluidas</span><b>${ov.length}</b><span>Monto total</span><b>${money(ov.reduce((s,t)=>s+t.amount,0))}</b><span>Umbral aplicado</span><b>${money(S.th.perTx)}</b><span>Generado por</span><b>${esc(cur().name)}</b></div><div class="mfoot"><button class="btn sec" data-act="closeModal">Cerrar</button></div>`;}
};

/* ===================== App del jugador ===================== */
function playerMode(){return `<div class="pmode"><div class="pbar"><button class="btn sec sm" data-act="erpMode">← Volver al ERP</button><span class="hint">App del jugador · HU-JUG-01, HU-JUG-03, HU-PRO-05 y retención</span></div><div class="phone">${PS[S.pa.screen]()}</div></div>`;}
const PS={
  registro:()=>{const r=S.pa.reg,rules=pwRules(r.pass),n=rules.filter(x=>x[0]).length,ok=emailOk(r.email),taken=S.players.some(p=>p.email.toLowerCase()===r.email.trim().toLowerCase()),minor=r.birth&&age(r.birth)<18;return `<form class="pscroll" data-form="pReg" autocomplete="off"><div style="text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px">${logoSVG(52)}<h2 style="font-size:22px">Crea tu perfil de jugador</h2><p class="hint" style="margin:0">Regístrate para recibir promociones a tu medida</p></div>
   <label class="field"><span>Nombre completo</span><input class="in" id="pr-n" data-bind="pa.reg.name" value="${esc(r.name)}" placeholder="Tu nombre"></label>
   <label class="field"><span>Fecha de nacimiento</span><input class="in ${minor?'err':''}" type="date" id="pr-b" data-bind="pa.reg.birth" value="${esc(r.birth)}"></label>${minor?'<span class="err-msg">Debes ser mayor de 18 años.</span>':''}
   <label class="field"><span>Correo electrónico</span><input class="in ${r.email&&(!ok||taken)?'err':''}" id="pr-e" inputmode="email" autocapitalize="off" data-bind="pa.reg.email" value="${esc(r.email)}" placeholder="tu@correo.com"></label>${r.email?(taken?'<span class="err-msg">Este correo ya está registrado.</span>':ok?'<span class="rules-check"><span class="ok">✓ Correo disponible</span></span>':''):''}
   <label class="field"><span>Contraseña</span><input class="in" id="pr-p" type="password" data-bind="pa.reg.pass" value="${esc(r.pass)}"></label><div class="strength">${[0,1,2,3].map(i=>`<i class="${i<n?'on':''}"></i>`).join('')}</div><div class="rules-check">${rules.map(([k,t])=>`<span class="${k?'ok':''}">${k?'✓':'○'} ${t}</span>`).join('')}</div>
   <label class="field"><span>Confirmar contraseña</span><input class="in ${r.pass2&&r.pass2!==r.pass?'err':''}" id="pr-p2" type="password" data-bind="pa.reg.pass2" value="${esc(r.pass2)}"></label>
   <label style="display:flex;gap:10px;align-items:flex-start;font-size:12px"><input type="checkbox" id="pr-ok" data-bind="pa.reg.ok" ${r.ok?'checked':''}> Acepto los términos y la política de datos personales (Ley 1581 de 2012)</label>
   ${S.pa.err?`<p class="err-msg">${esc(S.pa.err)}</p>`:''}<button class="btn primary block" type="submit">Crear cuenta</button><div class="card" style="padding:14px;display:flex;flex-direction:column;gap:8px"><span class="hint" style="font-weight:600">¿Ya tienes cuenta? Entra con un jugador de ejemplo</span><select class="in" id="pr-demo" data-bind="pa.demo">${S.players.filter(p=>p.st==='Activo').map(p=>{const seat=S.tables.find(t=>t.seated.some(x=>x.pid===p.id));return `<option value="${p.id}" ${S.pa.demo===p.id?'selected':''}>${esc(p.name)}${seat?' · jugando en '+seat.id:''}</option>`;}).join('')}</select><button type="button" class="btn sec block" data-act="pDemo">Entrar</button></div></form>`;},
  perfil:()=>{const f=S.pa.prof;return `<form class="pscroll" data-form="pProf"><div><h2 style="font-size:22px">Completa tu perfil</h2><p class="hint" style="margin:2px 0 8px">Paso 2 de 2</p><div class="bar gold"><i style="width:100%"></i></div></div><div class="alert ok"><b style="color:var(--ok)">Correo verificado</b><p>Te enviamos un correo de verificación. Ya puedes completar tu perfil.</p></div>
   <label class="field"><span>Teléfono</span><input class="in" id="pf-ph" data-bind="pa.prof.phone" value="${esc(f.phone)}" placeholder="+57 300 000 0000"></label>
   <div class="field"><span>Juegos preferidos (elige al menos uno)</span><div class="pills">${GAMES.map(g=>`<button type="button" class="pill ${f.prefs.includes(g)?'on':''}" data-act="pPref" data-arg="${g}">${g}</button>`).join('')}</div></div>
   <div class="field"><span>Horario preferido</span><div class="seg">${['Mañana','Tarde','Noche'].map(o=>`<button type="button" class="${f.slot===o?'on':''}" data-act="pSlot" data-arg="${o}">${o}</button>`).join('')}</div></div>
   <label class="field"><span>Ciudad</span><input class="in" id="pf-c" data-bind="pa.prof.city" value="${esc(f.city)}"></label>
   ${S.pa.err?`<p class="err-msg">${esc(S.pa.err)}</p>`:''}<button class="btn primary block" type="submit">Guardar perfil</button></form>`;},
  salida:()=>{const p=player(S.pa.pid),rec=recOffer(p);return `<div class="pscroll"><div style="text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px">${logoSVG(52)}<h2 style="font-size:22px">Antes de irte, ${esc(p.name.split(' ')[0])}</h2><p class="hint" style="margin:0">Elige un beneficio. Es opcional y solo puedes recibir uno hoy.</p></div>${Object.keys(OFFERS).map(k=>`<div class="offer ${k===rec?'rec':''}">${k===rec?'<span class="tag">Recomendado para ti</span>':''}<b>${offerName(k)}</b><p>${OFFERS[k].d()}</p><button class="btn ${k===rec?'primary':'sec'} block" data-act="pTakeOffer" data-arg="${k}">Lo quiero</button></div>`).join('')}<button class="btn sec block" data-act="pLeave">No, gracias. Terminar sesión</button><p class="hint" style="text-align:center;margin:0">¿Quieres poner límites a tu juego? Pídelo a un anfitrión: puedes autoexcluirte cuando quieras.</p></div>`;},
  adios:()=>`<div class="pscroll" style="justify-content:center;text-align:center;align-items:center">${logoSVG(64)}<h2 style="font-size:22px">${S.pa.claimed?'¡Listo!':'Sesión terminada'}</h2><p class="hint">${S.pa.claimed?esc(S.pa.claimed):'Gracias por tu visita. Te esperamos pronto.'}</p><button class="btn primary block" data-act="pTab" data-arg="promos">Ver mis bonos</button><button class="btn sec block" data-act="pLogout">Cerrar sesión</button></div>`,
  home:()=>{const p=player(S.pa.pid),t=tierOf(p),next=TIERS[TIERS.indexOf(t)+1],goal={Plata:2000,Oro:5000,Diamante:10000}[next],pr=promosFor(p),rec=recommend(p,2),tab=S.pa.tab;
   const promoCard=c=>{const done=p.red.filter(r=>r.cid===c.id).length>=c.limit;return `<div class="promo"><div class="grow"><b>${esc(c.name)}</b><small>${esc(c.value)} · ${esc(c.hours)}</small><div style="margin-top:6px;display:flex;gap:6px;align-items:center;flex-wrap:wrap">${B('Vence '+dmy(c.end).slice(0,5),'gold')}${done?B('Redimida','ok'):`<button class="btn primary sm" data-act="pRedeem" data-arg="${c.id}">Redimir</button>`}</div></div>${chipSVG(DENOMS[3],20)}</div>`;};
   const empty=`<div class="empty" style="background:var(--surface);border-radius:12px;border:1px dashed var(--border)">Aún no hay promociones para tus juegos favoritos.</div>`;
   const bens=p.benefits;
   let body='';
   if(tab==='inicio')body=`<div class="ptop"><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px"><div><h2 style="font-size:22px">Hola, ${esc(p.name.split(' ')[0])}</h2><p style="margin:2px 0 0;color:var(--felt-text);font-size:13px">Bienvenido a PitBoss Casino</p></div><button class="side-btn" style="padding:7px 10px" data-act="pExit">Me retiro</button></div><div class="ptier"><div style="display:flex;justify-content:space-between"><b style="color:var(--gold);font-size:18px">Nivel ${t}</b><b class="num">${grp(p.points)} pts</b></div><div class="bar gold" style="background:rgba(255,255,255,.15)"><i style="width:${next?Math.min(p.points/goal*100,100):100}%"></i></div><small style="color:var(--felt-text)">${next?`Te faltan ${grp(goal-p.points)} puntos para ${next}`:'Tienes el nivel más alto'}</small></div></div><div class="pscroll"><div style="display:flex;justify-content:space-between"><h2 style="font-size:16px">Promociones para ti</h2><button class="link" data-act="pTab" data-arg="promos">Ver todas</button></div>${pr.length?pr.slice(0,2).map(promoCard).join(''):empty}<h2 style="font-size:16px">Recomendado para ti</h2><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">${rec.map(r=>`<div class="card" style="padding:14px"><b>${r.t.game}</b><div class="hint">Mesa ${r.t.id} · ${r.t.free} libres</div><div style="margin-top:8px">${B(Math.round(r.s*100)+'% para ti','ok')}</div></div>`).join('')}</div></div>`;
   if(tab==='juegos')body=`<div class="pscroll"><h2 style="font-size:20px">Mesas disponibles</h2>${liveTables().filter(x=>x.st==='a'&&x.free>0).map(x=>`<div class="lrow"><div class="grow"><b>${x.game} · ${x.id}</b><small>${x.free} puestos libres · ${money(x.min)} – ${money(x.max)}</small></div>${p.prefs.includes(x.game)?B('Favorito','gold'):''}</div>`).join('')}</div>`;
   if(tab==='promos')body=`<div class="pscroll"><h2 style="font-size:20px">Mis bonos</h2>${bens.length?bens.map(b=>`<div class="promo"><div class="grow"><b>${offerName(b.type)}</b><small>${b.id} · vence ${dmy(b.exp)}</small><div style="margin-top:6px;display:flex;gap:6px;align-items:center">${B(b.st,b.st==='Canjeado'||b.st==='Usado'?'':'gold')}${b.type==='voucher'&&b.st==='Emitido'?`<button class="btn primary sm" data-act="pClaim" data-arg="${b.id}">Reclamar</button>`:''}</div>${b.st==='Reclamado'?`<small>Presenta el código ${b.id} en caja.</small>`:''}</div></div>`).join(''):'<div class="empty">No tienes bonos.</div>'}<h2 style="font-size:20px">Promociones</h2><p class="hint" style="margin:0">Según tu nivel ${t} y tus juegos: ${p.prefs.join(', ')}</p>${pr.length?pr.map(promoCard).join(''):empty}</div>`;
   if(tab==='perfil')body=`<div class="pscroll"><h2 style="font-size:20px">Mi perfil</h2><div class="card"><div class="kv"><span>Nombre</span><b>${esc(p.name)}</b><span>Correo</span><b style="word-break:break-all">${esc(p.email)}</b><span>Teléfono</span><b>${esc(p.phone||'—')}</b><span>Horario</span><b>${p.slot}</b></div></div><div class="field"><span>Juegos preferidos</span><div class="pills">${GAMES.map(g=>`<button type="button" class="pill ${p.prefs.includes(g)?'on':''}" data-act="pPrefSaved" data-arg="${g}">${g}</button>`).join('')}</div><span class="hint">Tus promociones se actualizan al instante.</span></div><button class="btn sec block" data-act="pLogout">Cerrar sesión</button></div>`;
   return `<div style="flex:1;overflow:auto;display:flex;flex-direction:column">${body}</div><nav class="ptabs">${[['inicio','Inicio'],['juegos','Juegos'],['promos','Bonos y promos'],['perfil','Perfil']].map(([k,l])=>`<button class="${tab===k?'on':''}" data-act="pTab" data-arg="${k}"><i></i>${l}</button>`).join('')}</nav>`;}
};

/* ===================== Acciones ===================== */
function seatOf(i){const t=S.tables.find(x=>x.dealer===cur().sid);return [t,t.seated[+i]];}
const ACT={
  go:v=>{if(!allowed(v))return false;S.view=v;window.scrollTo(0,0);},
  set:(a,el)=>{S.ui[el.dataset.k]=a;},
  toggle:(a,el)=>{S.ui[el.dataset.k]=!S.ui[el.dataset.k];},
  modal:(a,el)=>{S.modal={type:a,open:el.dataset.open,id:el.dataset.id,wide:['payroll','report','ret','csv'].includes(a)};},
  closeModal:(a,el,e)=>{if(el.dataset.self&&e.target!==el)return false;S.modal=null;},
  logout:()=>{audit('Usuarios y roles','R','Sesión',`Cierre de sesión · ${cur().name}`);S.user=null;S.login.err='';},
  playerMode:()=>{S.mode='player';},
  erpMode:()=>{S.mode='erp';},
  playerAs:id=>{S.pa=freshPA();S.pa.pid=id;S.pa.screen='home';S.mode='player';},
  reactivate:()=>{const p=player(S.ui.sel);p.st='Activo';p.reason='';audit('Perfiles','U','Jugador '+p.id,`Perfil reactivado · ${p.name}`,'ok');toast('Perfil reactivado.');},
  sendRec:()=>{const p=player(S.ui.recFor),r=recommend(p)[0];audit('Catálogo','R','Recomendación',`Recomendación enviada a ${p.name}: ${r.t.game} ${r.t.id}`);toast(`Recomendación enviada a ${p.name}.`);},
  signal:(i,el)=>{const [t,s]=seatOf(i),sig=el.dataset.s;if(!s.sig.includes(sig))s.sig.push(sig);S.modal={type:'ret',pid:s.pid,sig,origin:'Mesa '+t.id,min:s.min,wide:true,seat:+i};},
  leave:i=>{const [t,s]=seatOf(i),p=player(s.pid);t.seated.splice(+i,1);t.free++;if(p){p.hist.push(t.game);p.last='Hoy '+now();}audit('Mi mesa','U','Mesa '+t.id,`${p?p.name:s.anon} se retiró de la mesa`);toast(`${p?p.name.split(' ')[0]:'El jugador'} se retiró. Puesto libre.`);},
  cajaSignal:()=>{const p=player(S.txd.pid);S.modal={type:'ret',pid:p.id,sig:'Solicitud de cobro en caja',origin:'Caja 2',min:45,wide:true};},
  simulate:()=>{const p=player(S.ui.simP);const seat=S.tables.flatMap(t=>t.seated).find(s=>s.pid===p.id);S.modal={type:'ret',pid:p.id,sig:S.ui.simS,origin:'Simulación',min:seat?seat.min:45,wide:true};},
  retAccept:k=>{const m=S.modal,p=player(m.pid);const id=grantOffer(p,k,m.origin);S.retLog.unshift({t:now(),pid:p.id,sig:m.sig,origin:m.origin,offer:offerName(k),res:'Aceptada',val:k==='descuento'?0:OFFERS[k].val()});
    if(k==='bono'&&m.origin.startsWith('Mesa')){const t=table(m.origin.slice(5));t.chips=Math.max(0,t.chips-Math.round(S.ret.bonus/25000));}
    if(m.seat!=null){const [,s]=seatOf(m.seat);if(s)s.sig=[];}
    audit('Retención','C','OfertaRetencion '+id,`${offerName(k)} aceptada · ${p.name} · ${m.sig}`,'ok');S.modal=null;toast(`${p.name.split(' ')[0]} aceptó: ${offerName(k)} (${id}).`);},
  retReject:()=>{const m=S.modal,p=player(m.pid);S.retLog.unshift({t:now(),pid:p.id,sig:m.sig,origin:m.origin,offer:'Ofrecidas las 3 opciones',res:'Rechazada',val:0});audit('Retención','C','OfertaRetencion',`Oferta rechazada · ${p.name}`);S.modal=null;toast('Oferta rechazada. Quedó registrada.');},
  retBlocked:()=>{const m=S.modal,p=player(m.pid),chk=retCheck(p,m.min);if(p)S.retLog.unshift({t:now(),pid:p.id,sig:m.sig,origin:m.origin,offer:'—',res:'Bloqueada',why:chk.why,val:0});audit('Retención','R','Señal de retiro',`Oferta no aplicada · ${p?p.name:'sin tarjeta'} · ${chk.why}`,'bad');S.modal=null;},
  newCamp:()=>{S.draft=newDraft();S.view='campana';},
  editCamp:id=>{const c=S.campaigns.find(x=>x.id===id);S.draft={...JSON.parse(JSON.stringify(c)),err:''};S.view='campana';},
  activate:id=>{const c=S.campaigns.find(x=>x.id===id),n=eligible(c.rules).length;if(!n){toast('No se puede activar: ningún jugador activo cumple las reglas.',true);return;}c.status='Activa';c.elig=n;audit('Promociones','U','Campaña '+c.id,`Campaña activada · ${c.name} (${n} elegibles)`,'ok');toast(`"${c.name}" activa para ${n} jugadores elegibles.`);},
  duplicate:id=>{const c=S.campaigns.find(x=>x.id===id);S.draft={...JSON.parse(JSON.stringify(c)),id:null,name:c.name+' (copia)',start:'2026-11-01',end:'2026-11-30',err:''};S.view='campana';toast('Plantilla copiada. Ajusta las fechas y guárdala.');},
  setDraft:(a,el)=>{S.draft[el.dataset.k]=a;},
  ruleAdd:()=>{S.draft.rules.push({f:'avg',op:'gte',v:'100000'});},
  ruleDel:i=>{S.draft.rules.splice(+i,1);},
  saveResult:()=>{const u=S.ui,ex=S.exams.find(e=>e.id===u.exam&&e.status==='Pendiente')||S.exams.find(e=>e.status==='Pendiente');if(!ex)return;if(u.sec.some(v=>v===''||isNaN(+v)||+v<0||+v>100)){toast('Cada sección debe tener un puntaje entre 0 y 100.',true);return;}const total=Math.round(u.sec.reduce((a,b)=>a+ +b,0)/4),s=staff(ex.sid);ex.status=total>=ex.min?'Aprobado':'Reprobado';ex.total=total;if(ex.status==='Aprobado'){s.last=TODAY;s.score=total;s.exp=addMonths(TODAY,12);s.revoked=null;audit('Competencias','C','Certificación '+s.id,`Examen aprobado y certificación emitida · ${s.name} (${total})`,'ok');toast(`${s.name} aprobó con ${total}. Certificación vigente hasta ${dmy(s.exp)}.`);}else{audit('Competencias','C','Examen '+ex.id,`Examen reprobado · ${s.name} (${total})`,'bad');toast(`${s.name} no aprobó (${total} de ${ex.min}).`,true);}const nx=S.exams.find(e=>e.status==='Pendiente');u.exam=nx?nx.id:'';},
  exportCerts:()=>{const csv=['Empleado,Documento,Cargo,Juego,Puntaje,Vence,Estado',...S.staff.map(s=>[`"${s.name}"`,s.doc,s.role,s.game,s.score??'',s.exp||'',cert(s)[0]].join(','))].join('\n');audit('Competencias','R','Certificaciones','Exportación CSV del estado de certificaciones');S.modal={type:'csv',wide:true,title:'Estado de certificaciones',sub:'HU-PER-03 · CSV listo para auditoría',csv};},
  exportAudit:()=>{const u=S.ui,list=S.audit.filter(a=>(u.amod==='Todos'||a.mod===u.amod)&&(u.auser==='Todos'||a.u===u.auser));const csv=['fecha,usuario,modulo,accion,entidad,detalle,ip_origen',...list.map(a=>[`2026-10-05 ${a.t}`,`"${a.u}"`,`"${a.mod}"`,a.act,`"${a.ent}"`,`"${a.x.replace(/"/g,"'")}"`,'10.20.0.'+(12+a.u.length)].join(','))].join('\n');audit('Reportes','R','Log de auditoría',`Exportación CSV (${list.length} eventos)`);S.modal={type:'csv',wide:true,title:'Log de auditoría',sub:`HU-REP-05 · ${list.length} eventos filtrados`,csv};},
  copyCSV:()=>{const v=$('#csv-out').value;(navigator.clipboard?navigator.clipboard.writeText(v):Promise.reject()).then(()=>toast('CSV copiado.'),()=>{$('#csv-out').select();toast('Selecciona el texto y cópialo con Ctrl+C.',true);});return false;},
  schedDel:id=>{const r=S.sched.find(x=>x.id===id);S.sched=S.sched.filter(x=>x!==r);audit('Reportes','D','Reporte programado '+id,`Reporte eliminado · ${r.name}`,'bad');S.modal=null;toast('Reporte programado eliminado.');},
  resetPass:id=>{const x=userById(id);S.login.locked[id]=false;S.login.fails[id]=0;audit('Usuarios y roles','U','Usuario '+id,`Contraseña restablecida · ${x.name}`);toast(`Contraseña temporal enviada a ${x.email}. Bloqueos levantados.`);},
  userOff:id=>{const x=userById(id);x.st='Inactivo';audit('Usuarios y roles','D','Usuario '+id,`Cuenta desactivada · ${x.name}`,'bad');S.modal=null;toast(`${x.name} ya no puede iniciar sesión.`);},
  userOn:id=>{const x=userById(id);x.st='Activo';audit('Usuarios y roles','U','Usuario '+id,`Cuenta reactivada · ${x.name}`,'ok');toast(`${x.name} reactivado.`);},
  setTx:a=>{S.txd.type=a;},
  qty:(v,el)=>{const q=S.txd.q;q[v]=Math.max(0,(q[v]||0)+ +el.dataset.d);},
  txApprove:id=>{S.tx.find(x=>x.id===id).status='Aprobada';audit('Caja','U','Transacción '+id,'Pago aprobado','ok');toast(`${id} aprobada.`);},
  txVoid:id=>{S.tx.find(x=>x.id===id).status='Anulada';audit('Caja','D','Transacción '+id,'Transacción anulada','bad');toast(`${id} anulada.`);},
  redeemVoucher:id=>{const p=player(S.txd.pid),b=p.benefits.find(x=>x.id===id);b.st='Canjeado';S.delivered[25000]+=Math.round(b.value/25000);audit('Caja','U','Bono '+id,`Bono canjeado en caja · ${p.name} · ${money(b.value)}`,'ok');toast(`Entrega ${money(b.value)} en fichas a ${p.name.split(' ')[0]}.`);},
  restock:id=>{const t=table(id),need=Math.ceil(t.minChips*1.4)-t.chips;t.chips+=need;t.count=now();S.vault[25000]=Math.max(0,S.vault[25000]-need);audit('Inventario','U','Mesa '+id,`Reposición de ${need} fichas`);toast(`Mesa ${id} repuesta con ${grp(need)} fichas.`);},
  vaultOrder:v=>{S.vault[v]+=1500;audit('Inventario','C','Pedido de fichas',`1.500 fichas de ${money(+v)} recibidas en bóveda`);toast(`Llegaron 1.500 fichas de ${money(+v)} a la bóveda.`);},
  approveFill:id=>{const f=S.fills.find(x=>x.table===id),t=table(id);if(f){t.chips+=Math.round(f.amount/25000);t.fills++;S.fills=S.fills.filter(x=>x!==f);}t.st='a';audit('Operación de mesas','U','Mesa '+id,`Relleno aprobado${f?' por '+money(f.amount):''}`,'ok');toast(`Relleno de ${id} aprobado.`);},
  doCloseTable:()=>{const t=table(S.ui.table),d=staff(t.dealer);if(d)d.area='Sin asignar';t.dealer=null;t.st='c';t.free=t.seats;t.seated=[];S.fills=S.fills.filter(x=>x.table!==t.id);audit('Operación de mesas','U','Mesa '+t.id,`Mesa cerrada · drop ${money(t.drop)}`);S.modal=null;toast(`Mesa ${t.id} cerrada.`);},
