name: CI

on:
  push:
    branches: [main, develop, 'feature/**', 'chore/**', 'docs/**']
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    name: Backend .NET (build + pruebas)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restaurar dependencias
        run: dotnet restore CasinoErp.sln

      - name: Compilar
        run: dotnet build CasinoErp.sln --no-restore -c Release

      - name: Pruebas unitarias e integración con cobertura
        run: >
          dotnet test CasinoErp.sln --no-build -c Release
          --logger "trx;LogFileName=resultados.trx"
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults

      - name: Cobertura mínima del dominio (DoD ≥ 80 %)
        run: >
          dotnet test tests/CasinoErp.PruebasUnitarias -c Release --no-build
          /p:CollectCoverage=true /p:Threshold=80 /p:ThresholdType=line
          /p:Include="[CasinoErp.Dominio]*"

      - name: Publicar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-pruebas
          path: TestResults

  imagen-docker:
    name: Imagen Docker y Kubernetes (HU-09, HU-10)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Construir la imagen
        run: docker build -t pitboss-erp:ci .

      - name: Prueba de humo del contenedor (puerto 8080, usuario sin privilegios)
        run: |
          docker run -d --name pitboss -p 8080:8080 -e ASPNETCORE_ENVIRONMENT=Development pitboss-erp:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/api/salud; then echo; echo "Contenedor OK"; exit 0; fi
            sleep 2
          done
          echo "::error::El contenedor no respondió en /api/salud"
          docker logs pitboss
          exit 1

      - name: Sin clave JWT fuera de Development, la API no arranca
        run: |
          set +e
          timeout 60 docker run --rm -e ASPNETCORE_ENVIRONMENT=Production pitboss-erp:ci
          codigo=$?
          set -e
          if [ "$codigo" -eq 0 ] || [ "$codigo" -eq 124 ]; then
            echo "::error::La API arrancó sin Jwt__Clave (código $codigo)"
            exit 1
          fi
          echo "Rechazo esperado sin Jwt__Clave (código $codigo)"

      - name: Validar los manifiestos de Kubernetes
        run: kubectl apply -k k8s --dry-run=client --validate=false

  sin-marcas-ia:
    name: Sin marcas de agua de IA (AGENT.md §4.1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Revisar los mensajes de los commits nuevos
        env:
          EVENTO: ${{ github.event_name }}
          BASE_PR: ${{ github.event.pull_request.base.sha }}
          HEAD_PR: ${{ github.event.pull_request.head.sha }}
          ANTES: ${{ github.event.before }}
          DESPUES: ${{ github.sha }}
        run: |
          if [ "$EVENTO" = "pull_request" ]; then
            RANGO="$BASE_PR..$HEAD_PR"
          elif [ -z "$ANTES" ] || [ "$ANTES" = "0000000000000000000000000000000000000000" ]; then
            RANGO="origin/main..$DESPUES"
          else
            RANGO="$ANTES..$DESPUES"
          fi
          echo "Revisando $RANGO"
          PATRON='co-authored-by:.*(claude|anthropic|openai|copilot|gpt)|generated (with|by) .*\b(claude|ai)\b|noreply@anthropic\.com'
          if git log --format='%H%n%B' "$RANGO" | grep -inE "$PATRON"; then
            echo "::error::Hay marcas de agua o coautoría de IA en los commits de arriba. Ver AGENT.md §4.1."
            exit 1
          fi
          echo "Sin marcas de IA."
